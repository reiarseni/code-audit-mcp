[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-audit-mcp"
dynamic = ["version"]
description = "Code audit MCP server for Laravel/PHP, Python (FastAPI, Flask), TypeScript/React and Flutter/Dart: dead code, dependencies, security (Postgres, Redis, secrets in git history), CVEs, complexity and lint"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Reinaldo Arsenio Lorenzo Trujillo", email = "reiarseni@gmail.com"}]
dependencies = ["mcp>=1.9,<2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
code-audit-mcp-server = "code_audit_mcp.server:main"

[tool.setuptools.dynamic]
version = {attr = "code_audit_mcp.__version__"}

[tool.setuptools.packages.find]
include = ["code_audit_mcp*"]

[tool.setuptools.package-data]
"code_audit_mcp" = ["rules/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
extend-exclude = ["tests/fixtures"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
